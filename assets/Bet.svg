<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc">
  <title id="title">Proxies de penetração das bets no Brasil</title>
  <desc id="desc">Tabela comparando indicadores antes e depois da expansão e regulação do mercado de apostas no Brasil.</desc>

  <rect width="960" height="424" rx="14" ry="14" fill="#f7f6f2"/>

  <text x="50" y="50" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
    <tspan font-style="italic">Proxies</tspan> de penetração das bets no Brasil
  </text>
  <text x="50" y="78" fill="#5f6b73" font-family="Arial, Helvetica, sans-serif" font-size="15">
    Indicadores indiretos mostram a expansão das apostas no futebol, na <tspan font-style="italic">web</tspan> e nos aplicativos
  </text>

  <!-- Table background -->
  <rect x="50" y="105" width="860" height="270" rx="10" fill="#ffffff" stroke="#d7d2c8" stroke-width="1"/>

  <!-- Header -->
  <rect x="50" y="105" width="860" height="44" rx="10" fill="#263238"/>
  <rect x="50" y="132" width="860" height="17" fill="#263238"/>

  <text x="68" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">
    <tspan font-style="italic">Proxy</tspan>
  </text>
  <text x="245" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Antes</text>
  <text x="590" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Depois</text>

  <!-- Column lines -->
  <line x1="220" y1="105" x2="220" y2="375" stroke="#d7d2c8" stroke-width="1"/>
  <line x1="565" y1="105" x2="565" y2="375" stroke="#d7d2c8" stroke-width="1"/>

  <!-- Row lines -->
  <line x1="50" y1="149" x2="910" y2="149" stroke="#d7d2c8" stroke-width="1"/>
  <line x1="50" y1="194" x2="910" y2="194" stroke="#e6e1d8" stroke-width="1"/>
  <line x1="50" y1="239" x2="910" y2="239" stroke="#e6e1d8" stroke-width="1"/>
  <line x1="50" y1="284" x2="910" y2="284" stroke="#e6e1d8" stroke-width="1"/>
  <line x1="50" y1="329" x2="910" y2="329" stroke="#e6e1d8" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="68" y="174" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    Patrocínio na Série A
  </text>
  <text x="245" y="166" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="245" dy="0">Em ago/2022, os 20 clubes já tinham</tspan>
    <tspan x="245" dy="16">algum patrocinador de aposta; 7/20 máster</tspan>
  </text>
  <text x="590" y="166" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="590" dy="0">Em mar/2025, 20/20 tinham patrocínio</tspan>
    <tspan x="590" dy="16">de bets e 18/20 exibiam bet como máster</tspan>
  </text>

  <!-- Row 2 -->
  <text x="68" y="219" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    Patrocínio na Série B
  </text>
  <text x="245" y="211" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="245" dy="0">Para a temporada de 2022, 6/20 clubes tinham bet</tspan>
  <tspan x="245" dy="16">como patrocinador máster</tspan>
  </text>
  <text x="590" y="211" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="590" dy="0">Em abr/2025, 14/20 clubes tinham bet</tspan>
    <tspan x="590" dy="16">como patrocinador máster</tspan>
  </text>

  <!-- Row 3 -->
  <text x="68" y="264" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    Usuários
  </text>
  <text x="245" y="256" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="245" dy="0">Mercado sem estatística oficial robusta</tspan>
    <tspan x="245" dy="16">antes da regulação</tspan>
  </text>
  <text x="590" y="256" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="590" dy="0">17,7 mi no 1º semestre de 2025</tspan>
    <tspan x="590" dy="16">e 25,2 mi em 2025</tspan>
  </text>

  <!-- Row 4 -->
  <text x="68" y="309" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    Tráfego <tspan font-style="italic">web</tspan>
  </text>
  <text x="245" y="309" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    Sem série pública oficial
  </text>
  <text x="590" y="301" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="590" dy="0">Em mar/2026, bet.br apareceu como o</tspan>
    <tspan x="590" dy="16">2º site mais visitado do Brasil</tspan>
  </text>

  <!-- Row 5 -->
  <text x="68" y="354" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <tspan font-style="italic">Apps</tspan>
  </text>
  <text x="245" y="354" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    Sem série oficial consolidada de <tspan font-style="italic">ranking</tspan>
  </text>
  <text x="590" y="346" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <tspan x="590" dy="0">Em 21/04/2026, Superbet, Betano,</tspan>
    <tspan x="590" dy="16">Loterias CAIXA e bet365 estavam no topo</tspan>
  </text>
</svg>