<svg xmlns="http://www.w3.org/2000/svg"
     width="960"
     height="520"
     viewBox="0 0 960 520"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Estimativas da população em situação de rua no Brasil, 2020–2024</title>
  <desc id="desc">Gráfico de barras mostrando estimativas da população em situação de rua no Brasil entre 2020 e 2024. Barras azuis representam estimativas do IPEA para 2020 (214.451), 2021 (232.147) e 2022 (281.472). Barras âmbar representam registros do CadÚnico/MDS para 2023 (261.653) e 2024 (327.925). As duas séries usam metodologias distintas e não são diretamente comparáveis.</desc>

  <!-- Fundo -->
  <rect width="960" height="520" fill="#fcfbf7"/>

  <!-- Título e subtítulo -->
  <text x="60" y="50" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    Estimativas da população em situação de rua no Brasil (2020–2024)
  </text>
  <text x="60" y="76" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="14">
    Duas fontes, metodologias distintas e valores não comparáveis
  </text>

  <!-- Legenda -->
  <rect x="60" y="98" width="310" height="30" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  <rect x="78" y="108" width="20" height="12" rx="2" fill="#0072B2"/>
  <text x="106" y="119" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="13">Estimativa do IPEA</text>
  <rect x="230" y="108" width="20" height="12" rx="2" fill="#E69F00"/>
  <text x="258" y="119" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="13">CadÚnico e MDS</text>

  <!-- Grade horizontal -->
  <line x1="160" y1="420" x2="870" y2="420" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="160" y1="343" x2="870" y2="343" stroke="#e9ecef" stroke-width="1"/>
  <line x1="160" y1="266" x2="870" y2="266" stroke="#e9ecef" stroke-width="1"/>
  <line x1="160" y1="189" x2="870" y2="189" stroke="#e9ecef" stroke-width="1"/>
  <line x1="160" y1="150" x2="870" y2="150" stroke="#e9ecef" stroke-width="1"/>
  <!-- Eixo Y -->
  <line x1="160" y1="148" x2="160" y2="420" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- Rótulos eixo Y -->
  <text x="150" y="424" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end">0</text>
  <text x="150" y="347" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end">100 mil</text>
  <text x="150" y="270" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end">200 mil</text>
  <text x="150" y="193" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end">300 mil</text>
  <text x="150" y="154" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end">350 mil</text>

  <!-- Rótulo eixo Y vertical -->
  <text x="22" y="330" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12"
        text-anchor="middle" transform="rotate(-90, 22, 285)">Pessoas estimadas</text>

  <!-- === BARRAS IPEA (azul #0072B2) === -->

  <!-- 2020: 214.451 → y=255, h=165 -->
  <rect x="165" y="255" width="90" height="165" rx="3" fill="#0072B2"/>
  <text x="210" y="248" text-anchor="middle" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">214.451</text>

  <!-- 2021: 232.147 → y=241, h=179 -->
  <rect x="305" y="241" width="90" height="179" rx="3" fill="#0072B2"/>
  <text x="350" y="234" text-anchor="middle" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">232.147</text>

  <!-- 2022: 281.472 → y=203, h=217 -->
  <rect x="445" y="203" width="90" height="217" rx="3" fill="#0072B2"/>
  <text x="490" y="196" text-anchor="middle" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">281.472</text>

  <!-- Separador de metodologia: linha tracejada vertical -->
  <line x1="570" y1="148" x2="570" y2="428" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5,4"/>


  <!-- === BARRAS CadÚnico (âmbar #E69F00) === -->

  <!-- 2023: 261.653 → y=218, h=202 -->
  <rect x="605" y="218" width="90" height="202" rx="3" fill="#E69F00"/>
  <text x="650" y="211" text-anchor="middle" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">261.653</text>

  <!-- 2024: 327.925 → y=167, h=253 -->
  <rect x="745" y="167" width="90" height="253" rx="3" fill="#E69F00"/>
  <text x="790" y="160" text-anchor="middle" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">327.925</text>

  <!-- Rótulos eixo X (anos) -->
  <text x="210" y="443" text-anchor="middle" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">2020</text>
  <text x="350" y="443" text-anchor="middle" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">2021</text>
  <text x="490" y="443" text-anchor="middle" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">2022</text>
  <text x="650" y="443" text-anchor="middle" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">2023</text>
  <text x="790" y="443" text-anchor="middle" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">2024</text>

  <!-- Fontes -->
  <text x="60" y="476" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12">
    Fonte I: IPEA (Natalino, 2023) — estimativa indireta combinando Censo SUAS e variáveis socioeconômicas municipais
  </text>
  <text x="60" y="496" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="12">
    Fonte II: MDS/CadÚnico (dez. 2024) — cadastro voluntário para acesso a programas sociais
  </text>
</svg>