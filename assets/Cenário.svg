<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Cenários de custo de oportunidade das apostas</title>
  <desc id="desc">Comparação entre fluxos mensais de apostas e o valor acumulado ao longo de 12 meses considerando aplicação na Selic.</desc>

  <rect width="960" height="360" rx="14" ry="14" fill="#f7f6f2"/>

  <!-- Title -->
  <text x="50" y="50" fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
    Cenários de custo de oportunidade das apostas
  </text>
  <text x="50" y="78" fill="#5f6b73" font-family="Arial, Helvetica, sans-serif" font-size="15">
    Comparação entre gasto mensal em apostas e acumulação alternativa na Selic
  </text>

  <!-- Table background -->
  <rect x="50" y="105" width="860" height="200" rx="10" fill="#ffffff" stroke="#d7d2c8" stroke-width="1"/>

  <!-- Header -->
  <rect x="50" y="105" width="860" height="44" rx="10" fill="#263238"/>
  <rect x="50" y="132" width="860" height="17" fill="#263238"/>

  <text x="68" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cenário</text>
  <text x="350" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Fluxo mensal</text>
  <text x="520" y="133" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Acumulado em 12 meses (Selic)</text>

  <!-- Header quebrado -->
  <text x="780" y="125" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">
    <tspan x="780" dy="0">Juro bruto</tspan>
    <tspan x="780" dy="16">no período</tspan>
  </text>

  <!-- Column lines -->
  <line x1="320" y1="105" x2="320" y2="305" stroke="#d7d2c8" stroke-width="1"/>
  <line x1="500" y1="105" x2="500" y2="305" stroke="#d7d2c8" stroke-width="1"/>
  <line x1="760" y1="105" x2="760" y2="305" stroke="#d7d2c8" stroke-width="1"/>

  <!-- Row lines -->
  <line x1="50" y1="149" x2="910" y2="149" stroke="#d7d2c8" stroke-width="1"/>
  <line x1="50" y1="227" x2="910" y2="227" stroke="#e6e1d8" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="68" y="175" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <tspan x="68" dy="0">Apostador ativo médio</tspan>
    <tspan x="68" dy="16">(1º semestre de 2025)</tspan>
  </text>
  <text x="350" y="185" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="13">
    R$ 164 por mês
  </text>
  <text x="520" y="185" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="13">
    cerca de R$ 2.097,74
  </text>
  <text x="780" y="185" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="13">
    cerca de R$ 129,74
  </text>

  <!-- Row 2 -->
  <text x="68" y="253" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <tspan x="68" dy="0">Apostador da faixa mais alta</tspan>
    <tspan x="68" dy="16">(DataSenado)</tspan>
  </text>
  <text x="350" y="263" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="13">
    R$ 500 por mês
  </text>
  <text x="520" y="263" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="13">
    cerca de R$ 6.395,55
  </text>
  <text x="780" y="263" fill="#37474f" font-family="Arial, Helvetica, sans-serif" font-size="13">
    cerca de R$ 395,55
  </text>
</svg>