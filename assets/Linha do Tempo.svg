<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Linha do tempo do avanço legislativo do debate sobre o fim da escala 6x1 no Brasil</title>
  <desc id="desc">Linha do tempo com três marcos de abril de 2026: envio do projeto pelo governo em 14 de abril, aprovação de admissibilidade na CCJ em 22 de abril e criação da comissão especial em 24 de abril.</desc>
  <rect width="1200" height="460" fill="#fcfbf7"/>

  <line x1="110" y1="210" x2="1090" y2="210" stroke="#adb5bd" stroke-width="5" stroke-linecap="round"/>

  <circle cx="220" cy="210" r="16" fill="#0072B2"/>
  <circle cx="600" cy="210" r="16" fill="#009E73"/>
  <circle cx="980" cy="210" r="16" fill="#E69F00"/>

  <rect x="420" y="60" width="360" height="120" rx="16" fill="#ffffff" stroke="#dfe3e6" stroke-width="1.5"/>
  <text x="600" y="153" text-anchor="middle" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">22/04/2026</text>
  <text x="600" y="103" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">A CCJ da Câmara aprova a admissibilidade</text>
  <text x="600" y="123" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">de propostas que encerram a escala 6x1.</text>
  <rect x="20" y="245" width="400" height="120" rx="16" fill="#ffffff" stroke="#dfe3e6" stroke-width="1.5"/>
  <text x="220" y="278" text-anchor="middle" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">14/04/2026</text>
  <text x="220" y="307" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">O governo envia ao Congresso o projeto de lei</text>
  <text x="220" y="330" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">para acabar com a escala 6x1 e reduzir a</text>
  <text x="220" y="353" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">jornada para 40 horas semanais.</text>

  <rect x="780" y="245" width="400" height="120" rx="16" fill="#ffffff" stroke="#dfe3e6" stroke-width="1.5"/>
  <text x="980" y="278" text-anchor="middle" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">24/04/2026</text>
  <text x="980" y="307" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">A Câmara cria a comissão especial que vai</text>
  <text x="980" y="330" text-anchor="middle" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="15">discutir o mérito e o desenho da mudança.</text>
   <text x="60" y="432" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">Fontes: Casa Civil e Câmara dos Deputados | Dados de abr/2026</text>
</svg>