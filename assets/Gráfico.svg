<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc">
  <title id="title">Escala do CadÚnico em março de 2026</title>
  <desc id="desc">Comparação entre famílias cadastradas no CadÚnico, famílias em pobreza ou baixa renda dentro do cadastro e famílias beneficiárias do Bolsa Família acompanhadas pelo cadastro.</desc>
  <rect width="960" height="424" rx="14" ry="14" fill="#fcfbf7"/>
  <text x="60" y="58" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Escala do CadÚnico em março de 2026</text>
  <text x="60" y="86" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="16">O cadastro é maior que o Bolsa Família e funciona como base de entrada para dezenas de políticas</text>

  <line x1="290" y1="120" x2="290" y2="360" stroke="#adb5bd" stroke-width="1"/>
  <line x1="540" y1="120" x2="540" y2="360" stroke="#e9ecef" stroke-width="1"/>
  <line x1="790" y1="120" x2="790" y2="360" stroke="#e9ecef" stroke-width="1"/>

  <text x="290" y="108" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">0</text>
  <text x="540" y="108" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">21,1 mi</text>
  <text x="790" y="108" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">42,2 mi</text>

  <text x="60" y="170" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Famílias cadastradas</text>
  <rect x="290" y="140" width="500" height="42" rx="8" fill="#0072B2"/>
  <text x="810" y="168" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">42,2 mi</text>

  <text x="60" y="250" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">
  <tspan x="60" dy="0">Famílias em pobreza</tspan>
  <tspan x="60" dy="20">ou baixa renda</tspan>
</text>

<rect x="290" y="220" width="329" height="42" rx="8" fill="#009E73"/>
<text x="639" y="248" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">27,8 mi</text>

  <text x="60" y="330" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">
  <tspan x="60" dy="0">Famílias no</tspan>
  <tspan x="60" dy="20">Bolsa Família</tspan>
</text>

<rect x="290" y="300" width="222" height="42" rx="8" fill="#E69F00"/>
<text x="532" y="328" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">18,7 mi</text>

  <text x="60" y="394" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">Fonte: Ministério do Desenvolvimento e Assistência Social, Família e Combate à Fome (MDS) e Secom | Dados de mar/2026</text>
</svg>
