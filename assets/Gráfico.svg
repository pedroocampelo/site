<svg xmlns="http://www.w3.org/2000/svg"
     width="960"
     height="540"
     viewBox="0 0 960 540"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Escala do CadÚnico em março de 2026</title>
  <desc id="desc">Comparação entre famílias cadastradas no CadÚnico, famílias em pobreza ou baixa renda dentro do cadastro e famílias beneficiárias do Bolsa Família acompanhadas pelo cadastro.</desc>

  <!-- Fundo -->
  <rect width="960" height="540" fill="#fcfbf7"/>

  <!-- Título e subtítulo -->
  <text x="60" y="58" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
    Escala do CadÚnico em março de 2026
  </text>
  <text x="60" y="86" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="16">
    O cadastro é maior que o Bolsa Família e funciona como base de entrada para dezenas de políticas
  </text>

  <!-- Grade -->
  <line x1="260" y1="130" x2="260" y2="390" stroke="#adb5bd" stroke-width="1"/>
  <line x1="530" y1="130" x2="530" y2="390" stroke="#e9ecef" stroke-width="1"/>
  <line x1="800" y1="130" x2="800" y2="390" stroke="#e9ecef" stroke-width="1"/>

  <!-- Rótulos do eixo -->
  <text x="260" y="118" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">0</text>
  <text x="530" y="118" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">21,1 mi</text>
  <text x="800" y="118" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">42,2 mi</text>

  <!-- Linha 1 -->
  <rect x="260" y="150" width="540" height="42" rx="8" fill="#0072B2"/>
  <text x="240" y="180"
        fill="#212529"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        text-anchor="end">
    Famílias cadastradas
  </text>
  <text x="820" y="178" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">42,2 mi</text>

  <!-- Linha 2 -->
  <rect x="260" y="240" width="356" height="42" rx="8" fill="#009E73"/>
  <text x="240" y="270"
        fill="#212529"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        text-anchor="end">
    <tspan x="240" dy="0">Famílias em pobreza</tspan>
    <tspan x="240" dy="20">ou baixa renda</tspan>
  </text>
  <text x="636" y="268" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">27,8 mi</text>

  <!-- Linha 3 -->
  <rect x="260" y="330" width="239" height="42" rx="8" fill="#E69F00"/>
  <text x="240" y="360"
      fill="#212529"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      font-weight="600"
      text-anchor="end">
  <tspan x="240" dy="0">Famílias no</tspan>
  <tspan x="240" dy="20">Bolsa Família</tspan>
</text>
  <text x="519" y="358" fill="#212529" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">18,7 mi</text>

  <!-- Fonte -->
  <text x="60" y="438" fill="#6c757d" font-family="Arial, Helvetica, sans-serif" font-size="13">
    Fonte: Ministério do Desenvolvimento e Assistência Social, Família e Combate à Fome (MDS) e Secom | Dados de mar/2026
  </text>
</svg>