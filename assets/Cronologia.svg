<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1f2933; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #52616b; }
      .year { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #64748b; }
      .line { stroke: #CBD5E1; stroke-width: 5; stroke-linecap: round; }
      .dot { fill: #2563EB; stroke: #ffffff; stroke-width: 5; }
      .dot-alt { fill: #0F766E; stroke: #ffffff; stroke-width: 5; }
      .dot-warn { fill: #F59E0B; stroke: #ffffff; stroke-width: 5; }
      .card { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; rx: 18; }
      .card-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1.5; rx: 18; }
      .card-green { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1.5; rx: 18; }
      .card-yellow { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1.5; rx: 18; }
      .connector { stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 4 5; }
      .pill { fill: #E0F2FE; rx: 14; }
      .pill-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0369A1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>

  <!-- Header -->
  <text class="title" x="70" y="70">Linha do tempo do Cadastro Único</text>
  <text class="subtitle" x="70" y="100">
    Da criação institucional à expansão recente da base de famílias cadastradas
  </text>

  <!-- Timeline base -->
  <line class="line" x1="110" y1="265" x2="1090" y2="265"/>

  <!-- 2001 -->
  <line class="connector" x1="150" y1="265" x2="150" y2="185"/>
  <circle class="dot" cx="150" cy="265" r="16"/>
  <rect class="card-blue" x="55" y="118" width="190" height="80"/>
  <text class="year" x="125" y="150">2001</text>
  <text class="text" x="125" y="175">Criação</text>
  
  <!-- 2003 -->
  <line class="connector" x1="370" y1="265" x2="370" y2="355"/>
  <circle class="dot-alt" cx="370" cy="265" r="16"/>
  <rect class="card-green" x="260" y="342" width="225" height="112"/>
  <text class="year" x="350" y="377">2003</text>
  <text class="text" x="310" y="403">Ganha escala com</text>
  <text class="text" x="310" y="423">o Bolsa Família e a</text>
  <text class="text" x="290" y="443">integração de cadastros</text>

  <!-- 2010 -->
  <line class="connector" x1="590" y1="265" x2="590" y2="185"/>
  <circle class="dot" cx="590" cy="265" r="16"/>
  <rect class="card-blue" x="495" y="125" width="190" height="90"/>
  <text class="year" x="565" y="158">2010</text>
  <text class="text" x="545" y="184">Migração para</text>
  <text class="text" x="545" y="203">sistema online</text>

  <!-- 2021 -->
  <line class="connector" x1="805" y1="265" x2="805" y2="355"/>
  <circle class="dot-warn" cx="805" cy="265" r="16"/>
  <rect class="card-yellow" x="710" y="342" width="190" height="88"/>
  <text class="year" x="780" y="377">2021</text>
  <text class="text" x="750" y="403">28,9 milhões de</text>
  <text class="text" x="735" y="423">famílias cadastradas</text>

  <!-- 2026 -->
  <line class="connector" x1="1030" y1="265" x2="1030" y2="150"/>
  <circle class="dot-alt" cx="1030" cy="265" r="16"/>
  <rect class="card-green" x="910" y="105" width="240" height="120"/>
  <text class="year" x="1010" y="140">2026</text>
  <text class="text" x="980" y="166">42,2 milhões de</text>
  <text class="text" x="960" y="186">famílias cadastradas</text>
  <text class="small" x="955" y="210">Expansão pós-pandemia</text>

  <!-- Growth annotation (ajustada para baixo) -->
<path d="M 835 285 C 885 325, 955 325, 1008 285" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
<polygon points="1008,285 993,288 1001,299" fill="#0F766E"/>
<text class="pill-text" x="885" y="335">+13,3 milhões</text>
</svg>